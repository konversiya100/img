name: Prepare VK post images
on:
  push:
    paths:
      - 'sheets/**'
      - 'scripts/split_illustrations.py'
      - '.github/workflows/split-illustrations.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Render individual post images
        run: python scripts/split_illustrations.py
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mtg aircon jk atelier
          if ! git diff --staged --quiet; then
            git commit -m "Render original illustrations for VK posts"
            git push
          fi
